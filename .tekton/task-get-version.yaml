apiVersion: tekton.dev/v1
kind: Task
metadata:
  namespace: rhel-lightspeed-tenant
  name: get-version

spec:
  description: Get version number from VCS tags via hatch-vcs
  params:
    - name: source_artifact
      description: The Trusted Artifact URI pointing to the artifact with the application source code.
      type: string

  results:
    - name: pseudo_version
      description: Full version including dev suffix (e.g. 1.0.3.dev4+gabcdef)

    - name: version
      description: Clean version valid as a container tag (e.g. 1.0.3.dev4)

  volumes:
    - name: workdir
      emptyDir: {}

  stepTemplate:
    volumeMounts:
      - name: workdir
        mountPath: /var/workdir

  steps:
    - name: use-trusted-artifact
      image: quay.io/konflux-ci/build-trusted-artifacts:latest@sha256:dc542700b2e7ba806adfab360682d491c069bc2d6157d235c26adbe09480e26b
      args:
        - use
        - $(params.source_artifact)=/var/workdir/source

    - name: determine-image-tag
      image: registry.redhat.io/ubi10/s2i-base:latest
      workingDir: /var/workdir/source
      script: |
        #!/usr/bin/env bash
        set -euo pipefail

        python3 -V
        env | sort
        whoami
        pwd
        ls -la
        git status
        git tag

        python3 -m venv .venvs/hatch

        export PATH=".venvs/hatch/bin:$PATH"
        pip install hatch

        pseudo_version="$(hatch version)"
        version="${pseudo_version%%+*}"

        echo -n "$pseudo_version" | tee "$(results.pseudo_version.path)"
        echo -n "$version" | tee "$(results.version.path)"
