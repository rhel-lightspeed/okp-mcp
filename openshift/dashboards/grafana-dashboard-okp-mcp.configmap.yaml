        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "Solr highlighting returned nothing; fell back to local BM25 extraction. Occasional hits expected (query terms may not appear in doc), but sustained count means something is broken.",
          "fieldConfig": {
