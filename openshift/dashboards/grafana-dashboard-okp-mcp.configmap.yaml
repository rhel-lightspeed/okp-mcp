        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "Document IDs that returned zero results from Solr. Should be 0. Non-zero means the LLM passed a bad doc_id or search results are stale.",
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
