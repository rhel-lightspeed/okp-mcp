services:

  # Red Hat OKP - Offline Knowledge Portal (Solr-based documentation index)
  # Requires registry.redhat.io authentication: podman login registry.redhat.io
  redhat-okp:
    image: registry.redhat.io/offline-knowledge-portal/rhokp-rhel9:latest
    container_name: redhat-okp
    ports:
      - "8983:8983"
      # httpd serving the rendered documentation, where get_document reads the
      # real section anchors. The okp-mcp container below reaches it over the
      # pod network without this; publishing is for running the server from
      # source on the host, which then needs MCP_OKP_HTML_URL=http://localhost:8085.
      # Mapped off 8080 because that port is heavily contended on dev machines.
      - "8085:8080"
    environment:
      ACCESS_KEY: ${OKP_ACCESS_KEY}
      SOLR_JETTY_HOST: "0.0.0.0"
    volumes:
      - redhat-okp-data:/opt/solr/server/solr/portal/data
    restart: unless-stopped

  # OKP MCP Server - Solr bridge for LLM tool calls
  okp-mcp:
    build:
      context: .
      dockerfile: Containerfile
    image: okp-mcp:latest
    container_name: mcp-server
    ports:
      - "8000:8000"
    environment:
      MCP_SOLR_URL: http://redhat-okp:8983
    depends_on:
      - redhat-okp
    restart: unless-stopped

volumes:
  redhat-okp-data:
