name: CI

on:
  push:
    branches:
      - main
      - release/**

    tags:
      - v*

  pull_request:
    branches:
      - main
      - release/**

permissions:
  contents: read

jobs:
  sanity:
    name: Sanity - ${{ matrix.test.name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        test:
          - name: Type
            step_name: Check types
            command: make typecheck

          - name: Lint
            step_name: Run lint
            command: make lint

          - name: Format
            step_name: Run format check
            command: make format

          - name: Complexity
            step_name: Check complexity
            command: make radon

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: pyproject.toml

      - name: Install uv
        # zizmor: ignore[cache-poisoning] -- this job only runs linters and tests, never publishes artifacts
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      - name: Install dependencies
        run: |
          uv sync --locked --group dev
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: ${{ matrix.test.step_name }}
        run: ${{ matrix.test.command }}

  units:
    name: Unit - ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - '3.12'
          - '3.13'
          - '3.14'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        # zizmor: ignore[cache-poisoning] -- this job only runs tests, never publishes artifacts
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      - name: Install dependencies
        run: |
          uv sync --locked --group dev
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Run tests
        run: make test

  build:
    name: Build - ${{ matrix.platform }}

    needs:
      - sanity
      - units

    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        platform:
          - amd64
          - arm64

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and load
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Containerfile
          platforms: linux/${{ matrix.platform }}
          load: true
          provenance: false
          tags: okp-mcp:test-${{ matrix.platform }}
          build-args: BUILD_FROM_SOURCE=0
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test container startup
        run: scripts/test-container-startup.sh okp-mcp:test-${{ matrix.platform }}

  functional:
    name: Functional Tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    uses: ./.github/workflows/functional.yml
    secrets:
      REGISTRY_REDHAT_IO_USERNAME: ${{ secrets.REGISTRY_REDHAT_IO_USERNAME }}
      REGISTRY_REDHAT_IO_PASSWORD: ${{ secrets.REGISTRY_REDHAT_IO_PASSWORD }}
      OKP_ACCESS_KEY: ${{ secrets.OKP_ACCESS_KEY }}
